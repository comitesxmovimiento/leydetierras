<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta
      name="description"
      content="Una sola experiencia sobre la Ley de Tierras: la trama, tu voz, los datos y quiénes somos."
    />
    <title>La tierra no se vende</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Zilla+Slab:ital,wght@0,300;0,400;0,500;0,600;0,700;1,300;1,400;1,500;1,600;1,700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="./src/shared.css" />
    <link rel="stylesheet" href="./styles.css" />
    <script src="./app.js" defer></script>

    <!-- Meta Pixel Code -->

      ><img

  </head>
  <body class="landing">
    <header class="site-header">
      <a class="brand" href="#trama">
        <span class="brand-mark" id="brandMark">LT</span>
        <span id="brandLabel">La tierra no se vende</span>
      </a>
      <button
        class="menu-toggle"
        id="menuToggle"
        type="button"
        aria-expanded="false"
        aria-controls="siteMenu"
        aria-label="Abrir menú"
      >
        <span></span><span></span><span></span>
      </button>
    </header>

    <nav
      id="siteMenu"
      class="site-menu"
      aria-label="Secciones"
      aria-hidden="true"
    >
      <button
        class="menu-close"
        id="menuClose"
        type="button"
        aria-label="Cerrar menú"
      >
        ×
      </button>
      <ul class="menu-list" id="menuList"></ul>
      <button class="menu-share" id="menuShare" type="button">Compartir</button>
    </nav>

    <span class="story-counter" aria-live="polite"
      ><strong id="currentStep">01</strong> /
      <span id="totalSteps">01</span></span
    >

    <main>
      <section id="trama" class="story-intro">
        <div id="coverPicture" class="cover-picture"></div>
        <p class="eyebrow" id="coverEyebrow">Scrollytelling</p>
        <h1 id="coverTitle">La tierra<br />en juego</h1>
        <p id="coverIntro"></p>
        <a href="#storyFlow" class="scroll-cue" id="coverCta"
          >Empezar <span aria-hidden="true">↓</span></a
        >
        <div class="cover-scroll-gif">
          <img
            src="./src/media/scrolly/scroll-t.gif"
            alt=""
            aria-hidden="true"
          />
          <span>Empezá scrolleando</span>
        </div>
      </section>

      <div id="storyFlow"></div>

      <div id="placeholders"></div>
    </main>

    <div id="idleToast" class="idle-toast" role="status" aria-hidden="true">
      <img src="./src/media/scrolly/scroll-t.gif" alt="" />
      <span>Seguí scrolleando</span>
    </div>
  </body>
</html>
